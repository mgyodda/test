<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Тест по знаниям КУГ</title><meta name="description" content="Тест по знаниям КУГ: 11 вопросов, итоговый балл без сохранения ответов"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23265caa'/%3E%3Cpath d='m8 16 5 5 11-11' fill='none' stroke='%23ffffff' stroke-width='4'/%3E%3C/svg%3E"><style>
:root{color-scheme:light;--primary:#265caa;--on-primary:#fff;--primary-container:#d8e6ff;--on-primary-container:#0a315e;--surface:#f8f9fe;--surface-container:#edf0f8;--surface-low:#f2f4fb;--surface-high:#e6eaf4;--card:#fff;--text:#191c23;--muted:#444b59;--outline:#737b8a;--outline-variant:#c5cbd9;--error:#a52c2c;--error-container:#ffdad6;--success:#23633d;font-family:Roboto,"Segoe UI",system-ui,sans-serif;background:var(--surface);color:var(--text);font-synthesis:none}
*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}main{max-width:860px;margin:auto;padding:40px 24px 72px}.eyebrow{display:inline-flex;align-items:center;gap:8px;color:var(--primary);font-size:14px;font-weight:650;letter-spacing:.05em}.eyebrow svg{width:24px;height:24px}header{margin-bottom:28px}h1{font-size:clamp(30px,5vw,44px);font-weight:450;letter-spacing:-.025em;line-height:1.15;margin:16px 0}p{font-size:16px;line-height:1.6;color:var(--muted)}header>p{max-width:620px;margin:12px 0 20px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}.chip{font-size:14px;padding:7px 12px;border:1px solid var(--outline-variant);border-radius:8px;color:var(--muted);line-height:1.4}.chip.primary{background:var(--primary-container);border-color:transparent;color:var(--on-primary-container)}.progress-card{background:var(--surface-container);padding:18px 20px;border-radius:20px}.progress-label{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;margin-bottom:12px;color:var(--muted)}progress{display:block;appearance:none;width:100%;height:6px;border:0;border-radius:10px;overflow:hidden;background:var(--outline-variant);accent-color:var(--primary)}progress::-webkit-progress-bar{background:var(--outline-variant);border-radius:10px}progress::-webkit-progress-value{background:var(--primary);border-radius:10px}progress::-moz-progress-bar{background:var(--primary);border-radius:10px}
fieldset{min-width:0;border:1px solid var(--outline-variant);background:var(--card);border-radius:24px;margin:0 0 20px;padding:26px 28px;transition:border-color .18s}fieldset:focus-within{border-color:var(--primary)}legend{float:left;width:100%;font-size:22px;line-height:1.35;font-weight:550;margin-bottom:12px;letter-spacing:-.015em}legend span{display:inline-block;background:var(--primary-container);color:var(--on-primary-container);font-size:14px;font-weight:600;border-radius:7px;padding:5px 9px;margin-bottom:12px}legend .question-title{display:block;background:transparent;color:var(--text);font-size:22px;font-weight:550;border-radius:0;padding:0;margin:0}.prompt{clear:both;margin:0 0 12px;color:var(--text)}.hint{margin:0 0 18px;font-size:14px;color:var(--muted)}.option{position:relative;display:flex;gap:14px;align-items:flex-start;background:var(--surface-low);border:1px solid transparent;border-radius:16px;padding:16px;margin:10px 0;cursor:pointer;line-height:1.5;font-size:16px;transition:background .16s,border-color .16s}.option:hover{background:var(--surface-high)}.option:has(input:checked){background:var(--primary-container);border-color:var(--primary);color:var(--on-primary-container)}input[type=radio],input[type=checkbox]{accent-color:var(--primary);width:20px;height:20px;flex-shrink:0;margin:2px 0 0}input[type=number],textarea{width:100%;background:var(--surface-low);border:1px solid var(--outline);border-radius:8px;padding:17px 16px;color:var(--text);font-size:16px;line-height:1.5}input[type=number]:focus,textarea:focus{border-color:var(--primary)}textarea{min-height:132px;resize:vertical}
button{display:inline-flex;justify-content:center;align-items:center;gap:10px;min-height:48px;background:var(--primary);color:var(--on-primary);border:0;border-radius:28px;padding:14px 26px;font-size:16px;font-weight:600;cursor:pointer;box-shadow:0 1px 2px #0002;transition:filter .16s,box-shadow .16s}button:hover{filter:brightness(1.08);box-shadow:0 2px 6px #0003}button:active{box-shadow:none;filter:brightness(.94)}:focus-visible{outline:3px solid var(--primary);outline-offset:4px}.submit-row{display:flex;justify-content:space-between;align-items:center;gap:20px}.submit-row p{font-size:14px;margin:0}.validation{color:var(--error);font-size:16px}.validation:empty{display:none}
.result-summary{background:var(--primary-container);border-radius:28px;padding:36px;text-align:center;margin-bottom:28px}.result-summary h2{font-weight:500;font-size:26px;margin:0;color:var(--on-primary-container)}.score{display:flex;justify-content:center;align-items:baseline;gap:10px;color:var(--on-primary-container);margin:18px 0 12px}.score strong{font-size:76px;line-height:1.1;font-weight:550;letter-spacing:-.06em}.score span{font-size:24px}.result-summary p{color:var(--on-primary-container);margin:12px 0 22px}.review-heading{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:32px 0 18px}.review-heading h2{font-size:24px;font-weight:500;margin:0}.review-count{background:var(--error-container);color:var(--error);border-radius:20px;padding:6px 12px;font-size:14px}.mistake{background:var(--card);border:1px solid var(--outline-variant);border-radius:24px;padding:24px;margin-bottom:16px}.mistake h3{font-size:20px;font-weight:550;line-height:1.4;margin:8px 0 18px}.mistake-number{font-size:14px;color:var(--error);font-weight:550}.answer-block{padding:14px 16px;background:var(--surface-container);border-radius:12px;margin-top:12px;overflow-wrap:anywhere}.answer-block.correct{background:var(--primary-container)}.answer-label{display:block;font-size:14px;font-weight:600;color:var(--muted);margin-bottom:5px}.answer-block.correct .answer-label{color:var(--on-primary-container)}.answer-block p{margin:0;color:var(--text);white-space:pre-line}.review-note{font-size:14px;margin-bottom:0}.perfect{background:var(--surface-container);border-radius:24px;padding:24px;color:var(--success);font-size:18px;text-align:center;margin:24px 0}.privacy-note{font-size:14px;text-align:center;margin-top:24px}[hidden]{display:none!important}
@media(max-width:540px){main{padding:24px 16px 48px}fieldset{padding:20px;border-radius:20px}legend,.question-title{font-size:20px!important}.option{padding:14px 12px}.submit-row{flex-direction:column;align-items:stretch}.submit-row button{width:100%}.submit-row p{text-align:center}.result-summary{padding:28px 20px}.mistake{padding:20px}.review-heading h2{font-size:22px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style></head><body><main><header><div class="eyebrow"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="m8 12 3 3 5-6"/></svg>ПРОВЕРКА ЗНАНИЙ</div><h1>Тест по знаниям КУГ</h1><p>Один правильный ответ — один балл. Следуйте подсказкам к формату ответа.</p><div class="chips"><span class="chip primary">11 вопросов</span><span class="chip">Без сохранения ответов</span></div><div class="progress-card" id="progressWrap"><div class="progress-label"><label id="progressLabel" for="progress">Заполнено 0 из 11</label><span>Максимум 11 баллов</span></div><progress id="progress" value="0" max="11"></progress></div></header><form id="quiz" novalidate><div id="questions"></div><p class="validation" id="error" role="alert"></p><div class="submit-row"><button type="submit">Посмотреть результат</button><p>Проверка выполняется в браузере.</p></div></form><section id="result" hidden tabindex="-1" aria-labelledby="resultTitle"><div class="result-summary"><h2 id="resultTitle">Тест завершён</h2><div class="score" id="score"></div><p id="resultMessage"></p><button type="button" id="again">Пройти заново</button></div><div id="mistakes"></div><p class="privacy-note">Ответы показаны только на этой странице и не отправляются на сервер.</p></section></main><script>
const questions=[{"title": "Норма при 5 КУГах", "prompt": "В КУГ состоит 5 человек. Какова норма одного КУГа за один трёхдневный период?", "hint": "Ответьте числом: например, «12» означает 12 гадалок.", "type": "number", "answer": 20}, {"title": "Шаблон публикации", "prompt": "Какие элементы обязательно должны присутствовать в посте с гадалкой?", "hint": "Выберите все обязательные элементы.", "type": "multi", "options": ["Ник гадалки", "Ссылка на стрим обязательно с сайта бомжплейса", "Статус уведомлений", "Время создания аккаунта"], "answer": [0, 1, 2]}, {"title": "КД между публикациями", "prompt": "КУГ выложил гадалку с уведомлениями в 18:00. Когда можно выложить следующую гадалку с уведомлениями?", "hint": "Выберите время следующей публикации. Отсчёт — с появления прошлой гадалки в канале.", "options": ["18:01 — через 1 минуту", "18:05 — через 5 минут", "18:15 — через 15 минут", "19:00 — через час"], "answer": [1]}, {"title": "На кого действует КД", "prompt": "Указать все виды мошенниц, на которых действует КД.", "hint": "Отметьте все подходящие варианты.", "type": "multi", "options": ["Гадалки", "Таблеточницы", "Бифришницы", "Продавщицы всякого хлама", "Автогостевые с мошенниками", "Обычные игровые стримеры"], "answer": [0, 1, 2, 3, 4]}, {"title": "Повтор одной гадалки", "prompt": "Через сколько времени можно повторно отправить одну и ту же гадалку?", "hint": "Ответьте числом в часах: например, «12» означает через 12 часов.", "type": "number", "answer": 8}, {"title": "Банворды", "prompt": "Какие слова прямо входят в список банвордов из гайда?", "hint": "Введите минимум 3 разных слова. Например: «слово1, слово2, слово3». Разделяйте запятыми, пробелами или переносами строк. Регистр не важен; повтор одного слова считается один раз.", "type": "words"}, {"title": "Смена ника или юзернейма", "prompt": "КУГ хочет сменить ник и/или юзернейм. Что он должен сделать?", "options": ["Уведомить своего ВС и/или ЦК, если ВС не способен ответить", "Сменить без уведомления", "Уведомить только других участников КУГа"], "answer": [0]}, {"title": "Отпуск", "prompt": "Что означает один день отпуска КУГа?", "options": ["Освобождение от кидания 7 гадалок в текущем трёхдневном периоде", "Освобождение от всей нормы текущего периода", "Перенос всей нормы на следующий период"], "answer": [0]}, {"title": "Пересыл ссылок", "prompt": "Можно ли пересылать ссылки на гадалок из чата или канала?", "options": ["Да, без ограничений", "Да, с разрешения другого КУГа", "Категорически запрещается"], "answer": [2]}, {"title": "Проверка уведов", "prompt": "Каким образом лучше всего проверять уведы у гадалки? Какие есть методы проверки?", "hint": "Отметьте все методы из ответа в гайде.", "type": "multi", "options": ["Один раз написать в WhatsApp/Viber с вопросом «Можно на расклад?»", "Кинуть гадалку в канал со статусом «Проверка» и дать людям самим проверить уведы", "Ничего не проверять и всегда ставить «Включены»"], "answer": [0, 1]}, {"title": "Поиск гадалок", "prompt": "Как искать гадалок, какие есть для этого техники?", "hint": "Отметьте все методы из ответа в гайде.", "type": "multi", "options": ["Через поиск: гадание, таро, астрология, гадалка и т. д.", "Через рекомендации", "Только ждать, когда ссылку пришлёт другой участник"], "answer": [0, 1]}];
const banned=['бомбер','рейд','номер','сотовый','докс','деанон','спам','ебем','ебите','уничтожайте','срыв'];
function countWords(s){const words=new Set(s.normalize('NFKC').toLowerCase().replaceAll('ё','е').match(/[а-я]+/g)||[]);return banned.filter(w=>words.has(w)).length}

const form=document.getElementById('quiz');
questions.forEach((q,i)=>{
 const f=document.createElement('fieldset');f.id='question'+i;
 const l=document.createElement('legend');
 const number=document.createElement('span');number.textContent='Вопрос '+(i+1)+' из 11';
 const title=document.createElement('span');title.className='question-title';title.textContent=q.title;l.append(number,title);f.append(l);
 const prompt=document.createElement('p');prompt.className='prompt';prompt.textContent=q.prompt;f.append(prompt);
 const h=document.createElement('p');h.className='hint';h.id='hint'+i;h.textContent=q.hint||'Выберите один вариант.';f.append(h);
 if(q.type==='number'||q.type==='words'){
  const input=document.createElement(q.type==='number'?'input':'textarea');
  if(q.type==='number'){input.type='number';input.min=0;input.step=1;input.inputMode='numeric';input.placeholder=i===0?'Количество гадалок':'Количество часов'}
  else input.placeholder='Введите минимум три разных слова';
  input.name='q'+i;input.autocomplete='off';input.setAttribute('aria-label',q.title);input.setAttribute('aria-describedby',h.id);f.append(input);
 }else q.options.forEach((text,k)=>{
  const label=document.createElement('label');label.className='option';
  const input=document.createElement('input');input.type=q.type==='multi'?'checkbox':'radio';input.name='q'+i;input.value=k;input.setAttribute('aria-describedby',h.id);
  const caption=document.createElement('span');caption.textContent=text;label.append(input,caption);f.append(label);
 });
 document.getElementById('questions').append(f);
});
function readAnswers(){return questions.map((q,i)=>q.type==='number'||q.type==='words'?form.elements['q'+i].value.trim():[...form.querySelectorAll('input[name="q'+i+'"]:checked')].map(e=>Number(e.value)))}
const filled=a=>Array.isArray(a)?a.length>0:a!=='';
function isCorrect(q,a){return q.type==='number'?/^[0-9]+$/.test(a)&&Number(a)===q.answer:q.type==='words'?countWords(a)>=3:a.length===q.answer.length&&q.answer.every(v=>a.includes(v))}
function grade(answers){return questions.reduce((sum,q,i)=>sum+Number(isCorrect(q,answers[i])),0)}
function answerText(q,a,i){if(q.type==='number')return a+(i===0?' гадалок':' ч.');if(q.type==='words')return a;return a.map(v=>q.options[v]).join('\n')}
function correctText(q,i){if(q.type==='words')return 'Минимум три разных слова из списка: бомбер, рейд, номер, сотовый, докс, деанон, спам, ебем, ебите, уничтожайте, срыв.';return answerText(q,q.type==='number'?String(q.answer):q.answer,i)}
function renderMistakes(answers){
 const box=document.getElementById('mistakes');box.replaceChildren();
 const wrong=questions.map((q,i)=>({q,i,a:answers[i]})).filter(({q,a})=>!isCorrect(q,a));
 if(!wrong.length){const p=document.createElement('p');p.className='perfect';p.textContent='Ошибок нет. Все 11 ответов верные!';box.append(p);return 0}
 const heading=document.createElement('div');heading.className='review-heading';
 const h=document.createElement('h2');h.textContent='Разбор ошибок';
 const count=document.createElement('span');count.className='review-count';count.textContent=wrong.length+' из 11';heading.append(h,count);box.append(heading);
 wrong.forEach(({q,i,a})=>{
  const article=document.createElement('article');article.className='mistake';
  const number=document.createElement('div');number.className='mistake-number';number.textContent='Вопрос '+(i+1);
  const title=document.createElement('h3');title.textContent=q.title;
  const prompt=document.createElement('p');prompt.textContent=q.prompt;article.append(number,title,prompt);
  [['Твой ответ',answerText(q,a,i),false],['Правильный ответ',correctText(q,i),true]].forEach(([label,text,correct])=>{
   const b=document.createElement('div');b.className='answer-block'+(correct?' correct':'');
   const l=document.createElement('span');l.className='answer-label';l.textContent=label;
   const p=document.createElement('p');p.textContent=text;b.append(l,p);article.append(b);
  });
  if(q.type==='words'){const note=document.createElement('p');note.className='review-note';note.textContent='Распознано разных слов из списка: '+countWords(a)+'. Для балла нужно минимум 3. Повторы считаются один раз.';article.append(note)}
  else if(q.type==='multi'){const note=document.createElement('p');note.className='review-note';note.textContent='Нужно выбрать все правильные варианты без лишних.';article.append(note)}
  box.append(article);
 });
 return wrong.length;
}
function update(){const n=readAnswers().filter(filled).length;document.getElementById('progress').value=n;document.getElementById('progressLabel').textContent='Заполнено '+n+' из 11';document.getElementById('error').textContent=''}
function complete(){
 const answers=readAnswers();const empty=answers.findIndex(a=>!filled(a));
 if(empty>=0){document.getElementById('error').textContent='Ответьте на вопрос № '+(empty+1)+', чтобы завершить тест.';document.querySelector('#question'+empty+' input, #question'+empty+' textarea').focus();return {error:'unanswered',question:empty+1}}
 const score=grade(answers);const scoreBox=document.getElementById('score');scoreBox.replaceChildren();
 const value=document.createElement('strong');value.textContent=score;const total=document.createElement('span');total.textContent='/ 11';scoreBox.append(value,total);
 renderMistakes(answers);document.getElementById('resultMessage').textContent=score===11?'Все ответы верные. Отличный результат!':'Ниже — вопросы, в которых допущены ошибки.';
 form.reset();update();form.hidden=true;document.getElementById('progressWrap').hidden=true;
 const result=document.getElementById('result');result.hidden=false;result.focus();result.scrollIntoView({block:'start'});
 return {score,total:11,mistakes:11-score};
}
function restart(){form.reset();update();document.getElementById('mistakes').replaceChildren();document.getElementById('score').replaceChildren();document.getElementById('resultMessage').textContent='';form.hidden=false;document.getElementById('progressWrap').hidden=false;document.getElementById('result').hidden=true;form.querySelector('input').focus()}
form.addEventListener('input',update);form.addEventListener('submit',e=>{e.preventDefault();complete()});document.getElementById('again').addEventListener('click',restart);
if(document.modelContext?.registerTool){try{Promise.resolve(document.modelContext.registerTool({name:'complete_community_quiz',description:'Завершить заполненный тест и показать балл и ошибки без сохранения ответов.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:false},execute(input){if(!input||typeof input!=='object'||Object.keys(input).length)throw new Error('Ожидается пустой объект');if(form.hidden)throw new Error('Тест уже завершён');return complete()}})).catch(()=>{})}catch{}}
</script></body></html>
