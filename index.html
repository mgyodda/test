<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Тест по знаниям КУГ</title><meta name="description" content="Тест по знаниям КУГ: 11 вопросов, итоговый балл без сохранения ответов"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2356f0b1'/%3E%3Cpath d='m8 16 5 5 11-11' fill='none' stroke='%23101a22' stroke-width='4'/%3E%3C/svg%3E"><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#10151d;color:#edf2f8}*{box-sizing:border-box}body{margin:0}main{max-width:760px;margin:auto;padding:35px 20px 70px}header{border-bottom:1px solid #34414e;padding-bottom:25px;margin-bottom:25px}.brand{color:#56f0b1;font-weight:800;letter-spacing:.1em;font-size:14px}h1{font-size:clamp(28px,5vw,40px);line-height:1.2}p{color:#bbc8d6;line-height:1.6;font-size:16px}.meta{font-size:14px}progress{width:100%;height:8px;accent-color:#56f0b1}fieldset{border:1px solid #34414e;background:#18212c;border-radius:12px;margin:0 0 18px;padding:22px}legend{float:left;width:100%;font-size:19px;font-weight:700;line-height:1.4;margin-bottom:10px}legend span{display:block;font-size:14px;color:#56f0b1;margin-bottom:7px}fieldset p{clear:both;font-size:14px;margin:0 0 15px}.option{display:flex;gap:12px;align-items:flex-start;background:#111923;border:1px solid #34414e;border-radius:7px;padding:13px;margin:8px 0;cursor:pointer;line-height:1.5;font-size:16px}.option:has(input:checked){border-color:#56f0b1;background:#17342d}input[type=radio],input[type=checkbox]{accent-color:#56f0b1;width:18px;height:18px;flex-shrink:0;margin-top:3px}input[type=number],textarea{width:100%;background:#111923;border:1px solid #536374;color:#edf2f8;border-radius:7px;padding:14px;font:inherit;font-size:16px}textarea{min-height:110px;resize:vertical}button{background:#56f0b1;color:#10151d;border:0;border-radius:8px;padding:15px 23px;font:inherit;font-weight:750;cursor:pointer}button:hover{background:#8ff6cf}:focus-visible{outline:3px solid #8ff6cf;outline-offset:4px}#error{color:#ffb5ac}.result{text-align:center;border:1px solid #56f0b1;border-radius:14px;padding:40px 20px;background:#18212c}.score{font-size:68px;font-weight:800;color:#56f0b1;margin:20px 0}[hidden]{display:none!important}@media(max-width:500px){main{padding:25px 16px}fieldset{padding:17px}button{width:100%}}
</style></head><body><main><header><h1>Тест по знаниям КУГ</h1><p>Один правильный ответ — один балл. Следуйте подсказкам к формату ответа.</p><p class="meta">11 вопросов · Ответы не сохраняются и не отправляются</p><label id="progressLabel" for="progress">Заполнено 0 из 11</label><progress id="progress" value="0" max="11"></progress></header><form id="quiz" novalidate><div id="questions"></div><p id="error" role="alert"></p><button type="submit">Посмотреть результат</button></form><section id="result" class="result" hidden tabindex="-1" aria-labelledby="resultTitle"><h2 id="resultTitle">Тест завершён</h2><div class="score" id="score"></div><p>Количество набранных баллов из 11.</p><button type="button" id="again">Пройти заново</button></section></main><script>
const questions=[{"title": "Норма при 5 КУГах", "prompt": "В КУГ состоит 5 человек. Какова норма одного КУГа за один трёхдневный период?", "hint": "Ответьте числом: например, «12» означает 12 гадалок.", "type": "number", "answer": 20}, {"title": "Шаблон публикации", "prompt": "Какие элементы обязательно должны присутствовать в посте с гадалкой?", "hint": "Выберите все обязательные элементы.", "type": "multi", "options": ["Ник гадалки", "Ссылка на стрим обязательно с сайта бомжплейса", "Статус уведомлений", "Время создания аккаунта"], "answer": [0, 1, 2]}, {"title": "КД между публикациями", "prompt": "КУГ выложил гадалку с уведомлениями в 18:00. Когда можно выложить следующую гадалку с уведомлениями?", "hint": "Выберите время следующей публикации. Отсчёт — с появления прошлой гадалки в канале.", "options": ["18:01 — через 1 минуту", "18:05 — через 5 минут", "18:15 — через 15 минут", "19:00 — через час"], "answer": [1]}, {"title": "На кого действует КД", "prompt": "Указать все виды мошенниц, на которых действует КД.", "hint": "Отметьте все подходящие варианты.", "type": "multi", "options": ["Гадалки", "Таблеточницы", "Бифришницы", "Продавщицы всякого хлама", "Автогостевые с мошенниками", "Обычные игровые стримеры"], "answer": [0, 1, 2, 3, 4]}, {"title": "Повтор одной гадалки", "prompt": "Через сколько времени можно повторно отправить одну и ту же гадалку?", "hint": "Ответьте числом в часах: например, «12» означает через 12 часов.", "type": "number", "answer": 8}, {"title": "Банворды", "prompt": "Какие слова прямо входят в список банвордов из гайда?", "hint": "Введите минимум 3 разных слова. Например: «слово1, слово2, слово3». Разделяйте запятыми, пробелами или переносами строк. Регистр не важен; повтор одного слова считается один раз.", "type": "words"}, {"title": "Смена ника или юзернейма", "prompt": "КУГ хочет сменить ник и/или юзернейм. Что он должен сделать?", "options": ["Уведомить своего ВС и/или ЦК, если ВС не способен ответить", "Сменить без уведомления", "Уведомить только других участников КУГа"], "answer": [0]}, {"title": "Отпуск", "prompt": "Что означает один день отпуска КУГа?", "options": ["Освобождение от кидания 7 гадалок в текущем трёхдневном периоде", "Освобождение от всей нормы текущего периода", "Перенос всей нормы на следующий период"], "answer": [0]}, {"title": "Пересыл ссылок", "prompt": "Можно ли пересылать ссылки на гадалок из чата или канала?", "options": ["Да, без ограничений", "Да, с разрешения другого КУГа", "Категорически запрещается"], "answer": [2]}, {"title": "Проверка уведов", "prompt": "Каким образом лучше всего проверять уведы у гадалки? Какие есть методы проверки?", "hint": "Отметьте все методы из ответа в гайде.", "type": "multi", "options": ["Один раз написать в WhatsApp/Viber с вопросом «Можно на расклад?»", "Кинуть гадалку в канал со статусом «Проверка» и дать людям самим проверить уведы", "Ничего не проверять и всегда ставить «Включены»"], "answer": [0, 1]}, {"title": "Поиск гадалок", "prompt": "Как искать гадалок, какие есть для этого техники?", "hint": "Отметьте все методы из ответа в гайде.", "type": "multi", "options": ["Через поиск: гадание, таро, астрология, гадалка и т. д.", "Через рекомендации", "Только ждать, когда ссылку пришлёт другой участник"], "answer": [0, 1]}];
const banned=['бомбер','рейд','номер','сотовый','докс','деанон','спам','ебем','ебите','уничтожайте','срыв'];
function countWords(s){const words=new Set(s.normalize('NFKC').toLowerCase().replaceAll('ё','е').match(/[а-я]+/g)||[]);return banned.filter(w=>words.has(w)).length}
const form=document.getElementById('quiz');
questions.forEach((q,i)=>{const f=document.createElement('fieldset');f.id='question'+i;const l=document.createElement('legend');l.innerHTML='<span>ВОПРОС '+String(i+1).padStart(2,'0')+' / 11</span>';l.append(document.createTextNode(q.title));f.append(l);const h=document.createElement('p');h.id='hint'+i;h.textContent=(q.prompt+' ')+(q.hint||'Выберите один вариант.');f.append(h);if(q.type==='number'||q.type==='words'){const input=document.createElement(q.type==='number'?'input':'textarea');if(q.type==='number'){input.type='number';input.min=0;input.step=1;input.inputMode='numeric'}input.name='q'+i;input.autocomplete='off';input.setAttribute('aria-label',q.title);input.setAttribute('aria-describedby',h.id);f.append(input)}else q.options.forEach((text,k)=>{const label=document.createElement('label');label.className='option';const input=document.createElement('input');input.type=q.type==='multi'?'checkbox':'radio';input.name='q'+i;input.value=k;input.setAttribute('aria-describedby',h.id);label.append(input,document.createTextNode(text));f.append(label)});document.getElementById('questions').append(f)});
function readAnswers(){return questions.map((q,i)=>q.type==='number'||q.type==='words'?form.elements['q'+i].value.trim():[...form.querySelectorAll('input[name="q'+i+'"]:checked')].map(e=>Number(e.value)))}
const filled=a=>Array.isArray(a)?a.length>0:a!=='';
function grade(answers){return questions.reduce((sum,q,i)=>{const a=answers[i];const ok=q.type==='number'?/^[0-9]+$/.test(a)&&Number(a)===q.answer:q.type==='words'?countWords(a)>=3:a.length===q.answer.length&&q.answer.every(v=>a.includes(v));return sum+Number(ok)},0)}
function update(){const n=readAnswers().filter(filled).length;document.getElementById('progress').value=n;document.getElementById('progressLabel').textContent='Заполнено '+n+' из 11';document.getElementById('error').textContent=''}
function complete(){const answers=readAnswers();const empty=answers.findIndex(a=>!filled(a));if(empty>=0){document.getElementById('error').textContent='Ответьте на вопрос № '+(empty+1)+', чтобы завершить тест.';document.querySelector('#question'+empty+' input, #question'+empty+' textarea').focus();return {error:'unanswered',question:empty+1}}const score=grade(answers);document.getElementById('score').textContent=score+' / 11';form.reset();update();form.hidden=true;const result=document.getElementById('result');result.hidden=false;result.focus();return {score,total:11}}
form.addEventListener('input',update);form.addEventListener('submit',e=>{e.preventDefault();complete()});document.getElementById('again').addEventListener('click',()=>{form.reset();update();form.hidden=false;document.getElementById('result').hidden=true;form.querySelector('input').focus()});
if(document.modelContext?.registerTool){try{Promise.resolve(document.modelContext.registerTool({name:'complete_community_quiz',description:'Завершить заполненный тест и показать балл без сохранения ответов.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:false},execute(input){if(!input||typeof input!=='object'||Object.keys(input).length)throw new Error('Ожидается пустой объект');if(form.hidden)throw new Error('Тест уже завершён');return complete()}})).catch(()=>{})}catch{}}
</script></body></html>
